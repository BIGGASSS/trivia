name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Format, lint, and type check
        run: vp check

      - name: Unit tests
        run: vp test

      - name: Build
        run: vp run build

      - name: Build production server
        run: vp run build:server

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Browser tests (no server)
        run: vp exec playwright test
