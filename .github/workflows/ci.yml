name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Vite+, Node.js, and pnpm
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Format, lint, and type check
        run: vp check

      - name: Unit tests
        run: vp test

      - name: Build
        run: vp run build
